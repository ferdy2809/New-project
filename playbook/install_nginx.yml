---
- name: configure nginx webserver
  hosts: linux
  become: yes
  tasks:
  - name: update apt
    apt:
     name: apt
     state: latest
  - name: install nginx server
    apt:
     name: nginx                                                                                                                        
     state: latest                                                                                                                      
  - name: start nginx server                                                                                                           
    service:                                                                                                                            
     name: nginx                                                                                                                        
     state: started          